{% load static %}

<html lang="pt-BR">

    <title>
        {% block title %}Estúdio Fluxo{% endblock %}

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <header>
        <a href="{% url 'home' %}">
